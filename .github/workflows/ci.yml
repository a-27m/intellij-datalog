name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The Soufflé cross-check tests compare the plugin's parser against the real Soufflé parser.
      # Soufflé's official .deb targets Ubuntu 20.04 and depends on libffi7, which newer runners lack.
      - name: Install Soufflé
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mcpp libsqlite3-dev libffi-dev libncurses-dev zlib1g-dev
          curl -sSfL -o /tmp/libffi7.deb http://archive.ubuntu.com/ubuntu/pool/main/libf/libffi/libffi7_3.3-4_amd64.deb
          curl -sSfL -o /tmp/souffle.deb https://souffle-lang.github.io/ppa/ubuntu/pool/stable/x86_64-ubuntu-2004-souffle-2.4-Linux.deb
          sudo dpkg -i /tmp/libffi7.deb
          sudo dpkg -i --force-depends /tmp/souffle.deb
          souffle --version

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Test
        env:
          REQUIRE_SOUFFLE: "true"
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore

      # `archive: false` uploads the plugin zip as-is. Without it the artifact is wrapped in another zip,
      # and installing that outer zip in the IDE fails with "Fail to load plugin descriptor from file".
      # The artifact is named after the file (name is ignored).
      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          path: build/distributions/*.zip
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: "*.zip"
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
